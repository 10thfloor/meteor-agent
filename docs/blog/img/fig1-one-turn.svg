<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" role="img" aria-label="One agent turn across five Meteor primitives: a method writes the user row, a lease guards the turn, tokens stream through a capped collection and one publication carries rows and deltas into Minimongo, tools are method calls, and the assistant row commits once at the boundary.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#1f2a26"/>
    </marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#c98a2e"/>
    </marker>
  </defs>
  <g stroke="#1f2a26" fill="none" stroke-width="1.4">
    <!-- client -->
    <rect x="24" y="130" width="150" height="96" rx="6"/>
    <!-- messages collection -->
    <path d="M300 122h150v72a75 12 0 0 1-150 0z"/>
    <ellipse cx="375" cy="122" rx="75" ry="12"/>
    <!-- the turn -->
    <rect x="520" y="110" width="190" height="96" rx="6" stroke-width="1.8"/>
    <!-- provider -->
    <rect x="780" y="80" width="150" height="56" rx="28"/>
    <!-- deltas capped collection -->
    <path d="M780 210h150v58a75 11 0 0 1-150 0z"/>
    <ellipse cx="855" cy="210" rx="75" ry="11"/>
    <!-- method, under the turn -->
    <rect x="520" y="246" width="190" height="56" rx="6"/>
    <!-- watcher -->
    <rect x="300" y="386" width="410" height="56" rx="6" stroke-dasharray="5 4"/>
  </g>
  <g fill="#1f2a26">
    <text x="99" y="156" text-anchor="middle" font-weight="600">&lt;agent-chat&gt;</text>
    <text x="99" y="176" text-anchor="middle">Minimongo cursor</text>
    <text x="99" y="194" text-anchor="middle" font-size="11" fill="#5d6a65">rows + deltas, merged</text>
    <text x="375" y="160" text-anchor="middle" font-weight="600">agent_messages</text>
    <text x="375" y="177" text-anchor="middle" font-size="11" fill="#5d6a65">user · assistant · tool rows</text>
    <text x="615" y="140" text-anchor="middle" font-weight="600">the turn</text>
    <text x="615" y="160" text-anchor="middle">lease { serverId, until }</text>
    <text x="615" y="178" text-anchor="middle" font-size="11" fill="#5d6a65">30 s, heartbeat 10 s</text>
    <text x="615" y="194" text-anchor="middle" font-size="11" fill="#5d6a65">every write guarded by it</text>
    <text x="855" y="112" text-anchor="middle" font-weight="600">model provider</text>
    <text x="855" y="243" text-anchor="middle" font-weight="600">agent_deltas</text>
    <text x="855" y="259" text-anchor="middle" font-size="11" fill="#5d6a65">capped, 32 MiB</text>
    <text x="615" y="269" text-anchor="middle" font-weight="600">orders.lookup</text>
    <text x="615" y="287" text-anchor="middle" font-size="11" fill="#5d6a65">a Meteor method · gate: 'auto' | 'ask' | predicate</text>
    <text x="505" y="409" text-anchor="middle" font-weight="600">watcher, on every app server</text>
    <text x="505" y="427" text-anchor="middle" font-size="11" fill="#5d6a65">sweeps every 15 s · expired lease → any server re-runs the turn</text>
  </g>
  <!-- ink arrows -->
  <g stroke="#1f2a26" fill="none" stroke-width="1.4" marker-end="url(#a)">
    <path d="M174 170H298"/>
    <path d="M450 150H518"/>
    <path d="M710 128H778"/>
    <path d="M520 190H452"/>
  </g>
  <g stroke="#1f2a26" fill="none" stroke-width="1.4" marker-end="url(#a)" marker-start="url(#a)">
    <path d="M615 208V244"/>
  </g>
  <!-- amber: tokens and the publication corridor to the browser -->
  <g stroke="#c98a2e" fill="none" stroke-width="1.6">
    <path d="M855 136V198" marker-end="url(#aa)"/>
    <path d="M855 270V340H99V228" marker-end="url(#aa)"/>
    <path d="M375 206V340"/>
  </g>
  <g fill="#1f2a26" font-size="11">
    <text x="236" y="152" text-anchor="middle">agent.send</text>
    <text x="236" y="165" text-anchor="middle" fill="#5d6a65">a method → the user row</text>
    <text x="484" y="143" text-anchor="middle">activation</text>
    <text x="744" y="120" text-anchor="middle">stream</text>
    <text x="485" y="206" text-anchor="middle">commit, once</text>
    <text x="485" y="219" text-anchor="middle" fill="#5d6a65">atomic seq + budget</text>
    <text x="632" y="230" text-anchor="start">call</text>
  </g>
  <g fill="#c98a2e" font-size="11">
    <text x="872" y="172" text-anchor="start">tokens, as deltas</text>
    <text x="480" y="356" text-anchor="middle">one publication — agent.session — carries rows and deltas to the browser</text>
  </g>
</svg>
