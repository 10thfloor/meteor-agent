name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type-check (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Meteor
        run: curl https://install.meteor.com/?release=3.5 | sh

      - name: Cache Meteor packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.meteor
            app/.meteor/local
          key: meteor-3.5-typecheck-${{ runner.os }}-${{ hashFiles('app/.meteor/versions') }}

      - name: npm install
        working-directory: app
        run: meteor npm ci || meteor npm install

      - name: Type-check the package
        working-directory: app
        # No emit — Meteor transpiles by stripping types, so this is the only
        # gate that type-checks the package at all: signatures, imports,
        # property access, return drift, and — because the session counters go
        # through the `SessionInc` union — a mistyped `$inc` path like
        # `budgetSpent.toolCall` that would otherwise compile and silently
        # disable a budget. A type error MUST fail the build; `tsc` exits
        # non-zero on any diagnostic. (Arbitrary string modifier paths OUTSIDE
        # the counter set remain unchecked — the `as any` collection casts are
        # the follow-on burndown, tracked in the ledger.)
        run: npx tsc --noEmit

  test:
    name: Package suite (server + client)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Meteor
        run: curl https://install.meteor.com/?release=3.5 | sh

      - name: Cache Meteor packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.meteor
            app/.meteor/local
          key: meteor-3.5-${{ runner.os }}-${{ hashFiles('app/.meteor/versions') }}

      - name: npm install
        working-directory: app
        run: meteor npm ci || meteor npm install

      - name: Install Playwright browser
        working-directory: app
        # The client half of the suite runs in headless Chromium via
        # meteortesting:mocha's playwright driver; without a browser the
        # client tests silently do not run at all.
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: app
        env:
          TEST_BROWSER_DRIVER: playwright
        # Port 3200 mirrors local convention; any free port works on a runner.
        #
        # EVERY package, not just the core. The five surface packages were
        # absent here until the display clause landed, so their lens suites —
        # the round-trip law included — ran only on developers' machines, and a
        # lens could drop an affordance without CI noticing. tsconfig has always
        # type-checked them; that gate catches a bad import, never a bad render.
        run: >
          meteor test-packages --once --port 3200 --driver-package meteortesting:mocha
          ./packages/agent
          ./packages/agent-channel-slack
          ./packages/agent-channel-telegram
          ./packages/agent-channel-whatsapp
          ./packages/agent-channel-sms
          ./packages/agent-channel-email

  verify-build:
    name: Production bundle verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Meteor
        run: curl https://install.meteor.com/?release=3.5 | sh

      - name: Cache Meteor packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.meteor
            app/.meteor/local
          key: meteor-3.5-build-${{ runner.os }}-${{ hashFiles('app/.meteor/versions') }}

      - name: npm install
        working-directory: app
        run: meteor npm ci || meteor npm install

      - name: Verify the loader against a real bundle
        # Exercises the pi-ai resolution chain against meteor build's
        # relocated npm tree — the one layout the dev-tree suite cannot reach.
        run: ./scripts/verify-build.sh
