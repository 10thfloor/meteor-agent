name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type-check (tsc --noEmit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Meteor
        run: curl https://install.meteor.com/?release=3.5 | sh

      - name: Cache Meteor packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.meteor
            app/.meteor/local
          key: meteor-3.5-typecheck-${{ runner.os }}-${{ hashFiles('app/.meteor/versions') }}

      - name: Install dependencies
        working-directory: app
        run: meteor npm ci

      - name: Audit production dependencies
        working-directory: app
        # `high`, not `moderate`: meteor-node-stubs BUNDLES its polyfill
        # dependencies inside its tarball, so the `qs` copy nested under it
        # cannot be moved by `npm audit fix` or an `overrides` entry — only
        # by an upstream release. Its open advisories are moderate and reach
        # a browser-side querystring polyfill. Everything npm can actually
        # resolve is held at zero; drop back to `moderate` once
        # meteor-node-stubs ships a qs >= 6.16.
        run: meteor npm audit --omit=dev --audit-level=high

      - name: Type-check the package
        working-directory: app
        run: npm run typecheck

      - name: Verify the release package set
        working-directory: app
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: npm run release:check

      - name: Verify published declarations are current
        working-directory: app
        run: npm run types:check

  test:
    name: Package suite (server + client)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Meteor
        run: curl https://install.meteor.com/?release=3.5 | sh

      - name: Cache Meteor packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.meteor
            app/.meteor/local
          key: meteor-3.5-${{ runner.os }}-${{ hashFiles('app/.meteor/versions') }}

      - name: Install dependencies
        working-directory: app
        run: meteor npm ci

      - name: Install Playwright browser
        working-directory: app
        # The client half of the suite runs in headless Chromium via
        # meteortesting:mocha's playwright driver; without a browser the
        # client tests silently do not run at all.
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        working-directory: app
        env:
          TEST_BROWSER_DRIVER: playwright
        run: npm test

  test-app:
    name: Full-app suite (Constellation control plane)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Meteor
        run: curl https://install.meteor.com/?release=3.5 | sh

      - name: Cache Meteor packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.meteor
            app/.meteor/local
          key: meteor-3.5-app-${{ runner.os }}-${{ hashFiles('app/.meteor/versions') }}

      - name: npm install
        working-directory: app
        run: meteor npm ci || meteor npm install

      - name: Install Playwright browser
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Run the full-app suite
        working-directory: app
        # tests/main.js — the Constellation learning control plane: owner
        # gating, hardening evidence, crew archive. These tests ran on no
        # machine but a developer's until this job existed, which is exactly
        # how a governance regression shipped a green check.
        run: meteor npm run test-app:once

  verify-build:
    name: Production bundle verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Meteor
        run: curl https://install.meteor.com/?release=3.5 | sh

      - name: Cache Meteor packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.meteor
            app/.meteor/local
          key: meteor-3.5-build-${{ runner.os }}-${{ hashFiles('app/.meteor/versions') }}

      - name: Install dependencies
        working-directory: app
        run: meteor npm ci

      - name: Verify the loader against a real bundle
        # Exercises the pi-ai resolution chain against meteor build's
        # relocated npm tree — the one layout the dev-tree suite cannot reach.
        run: ./scripts/verify-build.sh
