<head>
  <title>10thfloor:agent demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <main id="chat">
    <header>
      <h1>10thfloor:agent</h1>
      <span id="phase" class="phase">idle</span>
    </header>
    <div id="messages"></div>
    <div id="approval" class="approval" hidden>
      <span id="approval-text"></span>
      <button id="approve">Approve</button>
      <button id="deny">Deny</button>
    </div>
    <form id="composer">
      <input id="input" autocomplete="off"
             placeholder='Try "what time is it?" or "refund my order"' />
      <button type="submit">Send</button>
      <button type="button" id="stop" title="Interrupt the turn">Stop</button>
    </form>
  </main>
</body>
